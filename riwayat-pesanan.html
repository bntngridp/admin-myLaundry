<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="" />
        <meta name="author" content="" />
        <title>Order History — myLaundry Admin</title>
        <link href="https://cdn.jsdelivr.net/npm/simple-datatables@7.1.2/dist/style.min.css" rel="stylesheet" />
        <link href="css/styles.css" rel="stylesheet" />
        <link href="css/custom-components.css" rel="stylesheet" />
        <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
        <script src="js/i18n.js"></script>
        <!-- Custom Web Components -->
        <script src="js/components.js" defer></script>
    </head>
    <body class="sb-nav-fixed">
        <admin-navbar></admin-navbar>
        <div id="layoutSidenav">
            <admin-sidebar></admin-sidebar>
            <div id="layoutSidenav_content">
                <main>
                    <div class="container-fluid px-4">
                        <h1 class="mt-4" data-i18n="history_title">Order History</h1>
                        <div class="card mb-4">
                            <div class="card-header">
                                <i class="fas fa-table me-1"></i>
                                <span data-i18n="history_list">Order History Table</span>
                            </div>
                            <div class="card-body">
                                <table id="datatablesSimple">
                                    <thead>
                                    <tr>
                                        <th data-i18n="history_col_order">Order</th>
                                        <th data-i18n="history_col_customer">Customer</th>
                                        <th data-i18n="history_col_date">Date</th>
                                        <th data-i18n="history_col_address">Address</th>
                                        <th data-i18n="history_col_service">Service Type</th>
                                        <th data-i18n="history_col_status">Status</th>
                                        <th data-i18n="history_col_total">Total</th>
                                        <th></th>
                                    </tr>
                                    </thead>
                                    <tfoot>
                                    <tr>
                                        <th data-i18n="history_col_order">Order</th>
                                        <th data-i18n="history_col_customer">Customer</th>
                                        <th data-i18n="history_col_date">Date</th>
                                        <th data-i18n="history_col_address">Address</th>
                                        <th data-i18n="history_col_service">Service Type</th>
                                        <th data-i18n="history_col_status">Status</th>
                                        <th data-i18n="history_col_total">Total</th>
                                        <th></th>
                                    </tr>
                                    </tfoot>
                                    <tbody id="ordersTableBody">
                                        <tr>
                                            <td colspan="8" class="text-center py-5 text-muted">
                                                <div class="d-flex flex-column align-items-center justify-content-center gap-2">
                                                    <div class="spinner-border text-primary spinner-border-sm" role="status">
                                                        <span class="visually-hidden">Loading...</span>
                                                    </div>
                                                    <span data-i18n="history_loading">Memuat riwayat pesanan...</span>
                                                </div>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </main>
                <admin-footer></admin-footer>
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
        <script src="js/scripts.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/simple-datatables@7.1.2/dist/umd/simple-datatables.min.js" crossorigin="anonymous"></script>
        <script src="js/api.js"></script>
        <script>
            // Status Mappers for Style Badges
            const statusClasses = {
                'completed': 'riwayat-selesai',
                'done': 'riwayat-selesai',
                'cancelled': 'riwayat-dibatalkan'
            };

            function getStatusClass(status) {
                const key = (status || '').toLowerCase();
                return statusClasses[key] || 'riwayat-selesai';
            }

            function getStatusLabel(status) {
                if (!status) return window.i18n ? window.i18n.t('status_completed') : 'Completed';
                const s = status.toLowerCase();
                if (s === 'completed' || s === 'done') return window.i18n ? window.i18n.t('status_completed') : 'Completed';
                if (s === 'cancelled') return window.i18n ? window.i18n.t('status_cancelled') : 'Cancelled';
                return status.split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
            }

            // Fetch and load order history
            async function loadHistory() {
                const tbody = document.getElementById('ordersTableBody');
                if (!tbody) return;

                try {
                    const response = await apiFetch('/orders/');
                    if (!response || !response.success) {
                        throw new Error('Gagal mengambil riwayat pesanan dari API.');
                    }

                    const orders = response.data || [];
                    // Show only completed and cancelled orders
                    const historyOrders = orders.filter(order => {
                        const status = (order.status || '').toLowerCase();
                        return status === 'done' || status === 'completed' || status === 'cancelled';
                    });

                    tbody.innerHTML = '';
                    if (historyOrders.length > 0) {
                        // Sort orders by ID descending (newest first)
                        const sortedOrders = [...historyOrders].sort((a, b) => b.id - a.id);
                        
                        sortedOrders.forEach(order => {
                            const row = document.createElement('tr');
                            
                            const dateObj = new Date(order.created_at);
                            const options = { month: 'short', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false };
                            const lang = window.i18n ? window.i18n.getLanguage() : 'id';
                            const locale = lang === 'en' ? 'en-US' : 'id-ID';
                            const formattedDate = dateObj.toLocaleDateString(locale, options).replace(',', '');
                            
                            const guestStr = window.i18n ? window.i18n.t('guest_customer') : 'Guest';
                            const noAddressStr = window.i18n ? window.i18n.t('no_address') : 'No Address';
                            const viewDetailsStr = window.i18n ? window.i18n.t('btn_view_details') : 'View Details';

                            const customerName = order.customer ? (order.customer.username || guestStr) : guestStr;
                            const customerEmail = order.customer ? (order.customer.email || '') : '';
                            const addressText = order.address && order.address.street_name ? 
                                `${order.address.receiver_name}, ${order.address.street_name}` : noAddressStr;
                            const serviceText = order.service ? (order.service.title || 'Dry Clean') : 'Dry Clean';
                            
                            const priceVal = order.total_price || 0;
                            const formattedTotal = new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(priceVal);
                            
                            const statusLabel = getStatusLabel(order.status);
                            const statusClass = getStatusClass(order.status);
                            const bootstrapBtnClass = (order.status || '').toLowerCase() === 'cancelled' ? 'btn-danger' : 'btn-success';
                            
                            row.innerHTML = `
                                <td>#${order.id}</td>
                                <td>
                                    ${customerName} <br> <small class="text-muted">${customerEmail}</small>
                                </td>
                                <td>${formattedDate}</td>
                                <td>${addressText}</td>
                                <td>${serviceText}</td>
                                <td><span class="status-riwayat-pesanan ${statusClass} btn ${bootstrapBtnClass}">${statusLabel}</span></td>
                                <td>${formattedTotal}</td>
                                <td><a href="detail-riwayat-pesanan.html?id=${order.id}" class="details-btn btn btn-primary btn-sm">${viewDetailsStr}</a></td>
                            `;
                            tbody.appendChild(row);
                        });
                    } else {
                        const emptyTitle = window.i18n ? window.i18n.t('history_empty_title') : 'Belum Ada Riwayat';
                        const emptyDesc = window.i18n ? window.i18n.t('history_empty_desc') : 'Semua pesanan yang telah diselesaikan atau dibatalkan akan muncul di sini.';
                        tbody.innerHTML = `
                            <tr>
                                <td colspan="8" class="text-center py-5 text-muted">
                                    <div class="d-flex flex-column align-items-center justify-content-center gap-2">
                                        <i class="fas fa-history fa-3x mb-2" style="color: #dee2e6;"></i>
                                        <h5 class="fw-bold" style="color: #6c757d;">${emptyTitle}</h5>
                                        <p class="text-muted small mb-0">${emptyDesc}</p>
                                    </div>
                                </td>
                            </tr>
                        `;
                    }

                    // Initialize Simple DataTable only if there is data
                    if (historyOrders.length > 0) {
                        const datatablesSimple = document.getElementById('datatablesSimple');
                        if (datatablesSimple && !datatablesSimple.classList.contains('dataTable-table')) {
                            new simpleDatatables.DataTable(datatablesSimple);
                        }
                    }

                } catch (error) {
                    console.error('Error loading history:', error);
                    const errorTitle = window.i18n ? window.i18n.t('history_error_title') : 'Gagal Memuat Data';
                    const retryBtnText = window.i18n ? window.i18n.t('history_retry_btn') : 'Coba Lagi';
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="8" class="text-center py-5 text-danger">
                                <div class="d-flex flex-column align-items-center justify-content-center gap-2">
                                    <i class="fas fa-exclamation-circle fa-3x mb-2" style="color: #dc3545;"></i>
                                    <h5 class="fw-bold">${errorTitle}</h5>
                                    <p class="small mb-0">${error.message || 'Koneksi ke server terputus. Silakan coba lagi.'}</p>
                                    <button onclick="loadHistory()" class="btn btn-outline-danger btn-sm mt-2">${retryBtnText}</button>
                                </div>
                            </td>
                        </tr>
                    `;
                }
            }

            window.addEventListener('DOMContentLoaded', () => {
                if (window.i18n) window.i18n.applyTranslations();
                loadHistory();
            });
            window.addEventListener('languageChanged', () => {
                if (window.i18n) window.i18n.applyTranslations();
                loadHistory();
            });
        </script>
    </body>
</html>
