<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="" />
    <meta name="author" content="" />
    <title>Activity Log — myLaundry Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/simple-datatables@7.1.2/dist/style.min.css" rel="stylesheet" />
    <link href="css/styles.css" rel="stylesheet" />
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
    <!-- Custom Web Components -->
    <script src="js/api.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/components.js" defer></script>
</head>
<body class="sb-nav-fixed">
<admin-navbar></admin-navbar>
<div id="layoutSidenav">
    <admin-sidebar></admin-sidebar>
    <div id="layoutSidenav_content">
        <main>
            <div class="container-fluid px-4">
                <div class="d-flex justify-content-between align-items-center mt-4 mb-4">
                    <div>
                        <h1 class="m-0 fw-bold" style="color: #0B1739; font-size: 1.75rem;" data-i18n="activity_title">Log Aktivitas</h1>
                        <p class="text-muted m-0" style="font-size: 0.88rem;" data-i18n="activity_subtitle">Catatan aktivitas sistem dan audit log operasi admin</p>
                    </div>
                    <button class="btn btn-outline-danger" id="clear-logs-btn">
                        <i class="fas fa-trash me-1"></i><span data-i18n="activity_btn_clear">Bersihkan Log</span>
                    </button>
                </div>
                
                <div class="card mb-4">
                    <div class="card-header">
                        <i class="fas fa-history me-1" style="color: #0007B0;"></i>
                        <span data-i18n="activity_card_header">Riwayat Operasi Sistem</span>
                    </div>
                    <div class="card-body">
                        <table id="datatablesSimple">
                            <thead>
                            <tr>
                                <th data-i18n="activity_col_timestamp">Waktu</th>
                                <th data-i18n="activity_col_user">Pengguna Admin</th>
                                <th data-i18n="activity_col_module">Modul</th>
                                <th data-i18n="activity_col_action">Deskripsi Tindakan</th>
                                <th data-i18n="activity_col_ip">Alamat IP</th>
                            </tr>
                            </thead>
                            <tfoot>
                            <tr>
                                <th data-i18n="activity_col_timestamp">Waktu</th>
                                <th data-i18n="activity_col_user">Pengguna Admin</th>
                                <th data-i18n="activity_col_module">Modul</th>
                                <th data-i18n="activity_col_action">Deskripsi Tindakan</th>
                                <th data-i18n="activity_col_ip">Alamat IP</th>
                            </tr>
                            </tfoot>
                            <tbody id="activityTableBody">
                            <tr>
                                <td colspan="5" class="text-center py-4 text-muted">
                                    <span data-i18n="activity_loading">Memuat log aktivitas...</span>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
        <admin-footer></admin-footer>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/simple-datatables@7.1.2/dist/umd/simple-datatables.min.js" crossorigin="anonymous"></script>
<script>
    let activityDataTable = null;

    async function loadActivityLogs() {
        const tbody = document.getElementById('activityTableBody');
        if (!tbody) return;

        try {
            const res = await apiFetch('/auth/login-history');
            const logs = (res && res.data) ? res.data : [];

            if (activityDataTable) {
                activityDataTable.destroy();
                activityDataTable = null;
            }

            if (logs.length === 0) {
                const emptyText = window.i18n ? window.i18n.t('activity_empty') : 'Belum ada catatan aktivitas login atau sesi.';
                tbody.innerHTML = `<tr><td colspan="5" class="text-center py-4 text-muted">${emptyText}</td></tr>`;
                return;
            }

            tbody.innerHTML = logs.map(item => {
                const dateObj = new Date(item.logged_at || item.CreatedAt);
                const isEn = window.i18n && window.i18n.currentLang === 'en';
                const dateStr = !isNaN(dateObj.getTime()) ? dateObj.toLocaleString(isEn ? 'en-US' : 'id-ID', {
                    dateStyle: 'medium',
                    timeStyle: 'medium'
                }) : '-';

                const username = (item.user && item.user.username) ? item.user.username : ((item.user && item.user.email) ? item.user.email : ('User #' + item.user_id));
                
                const role = (item.role || (item.user && item.user.role) || 'USER').toUpperCase();
                let badgeClass = 'bg-secondary';
                if (role === 'ADMIN') badgeClass = 'bg-primary';
                else if (role === 'COURIER') badgeClass = 'bg-info text-dark';
                else if (role === 'CUSTOMER') badgeClass = 'bg-success';

                const actionText = item.success 
                    ? (window.i18n ? window.i18n.t('activity_action_login_success') : 'Berhasil masuk ke dalam sistem')
                    : (window.i18n ? window.i18n.t('activity_action_login_failed') : 'Gagal melakukan autentikasi login');

                const ip = item.ip || '-';

                return `
                    <tr>
                        <td>${dateStr}</td>
                        <td class="fw-semibold">${escapeHtml(username)}</td>
                        <td><span class="badge ${badgeClass}">${escapeHtml(role)}</span></td>
                        <td>${escapeHtml(actionText)}</td>
                        <td><code>${escapeHtml(ip)}</code></td>
                    </tr>
                `;
            }).join('');

            const tableEl = document.getElementById('datatablesSimple');
            if (tableEl && !tableEl.classList.contains('dataTable-table')) {
                activityDataTable = new simpleDatatables.DataTable(tableEl, {
                    perPage: 10,
                    perPageSelect: false
                });
            }
        } catch (err) {
            console.error('Error loading activity logs:', err);
            const emptyText = window.i18n ? window.i18n.t('activity_empty') : 'Belum ada catatan aktivitas login atau sesi.';
            tbody.innerHTML = `<tr><td colspan="5" class="text-center py-4 text-muted">${emptyText}</td></tr>`;
        }
    }

    function escapeHtml(str) {
        if (!str) return '';
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }

    document.getElementById('clear-logs-btn').addEventListener('click', async function() {
        const confirmMsg = window.i18n ? window.i18n.t('activity_confirm_clear') : 'Apakah Anda yakin ingin membersihkan semua log sistem? Tindakan ini tidak dapat dibatalkan.';
        if (confirm(confirmMsg)) {
            try {
                await apiFetch('/auth/login-history', { method: 'DELETE' });
                const successMsg = window.i18n ? window.i18n.t('activity_clear_success') : 'Log sistem berhasil dibersihkan.';
                alert(successMsg);
                await loadActivityLogs();
            } catch (err) {
                console.error('Failed to clear logs:', err);
                const failMsg = window.i18n ? window.i18n.t('activity_clear_fail') : 'Gagal membersihkan log sistem.';
                alert(failMsg);
            }
        }
    });

    window.addEventListener('DOMContentLoaded', () => {
        if (window.i18n) window.i18n.applyTranslations();
        loadActivityLogs();
    });

    window.addEventListener('languageChanged', () => {
        if (window.i18n) window.i18n.applyTranslations();
        loadActivityLogs();
    });
</script>
</body>
</html>
